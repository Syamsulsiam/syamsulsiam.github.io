function qTotal(r,vid){const q=r.quotes[vid];if(!q||!q.p)return null;let t=0;for(let k=0;k<r.items.length;k++){const p=+q.p[k];if(!(p>0))return null;t+=p*r.items[k].qty}return t}
function qcfRows(r){
 const rows=r.invited.map(v=>({vid:v,q:r.quotes[v]||{},total:qTotal(r,v)})).filter(x=>x.total);
 if(!rows.length)return [];

 const leads=rows.map(x=>+x.q.lead||0).filter(x=>x>0);const minL=leads.length?Math.min(...leads):1;
 rows.forEach(x=>{x.sp=minT/x.total*100;x.st=(+x.q.tech||0)/5*100;x.sl=(+x.q.lead>0)?minL/(+x.q.lead)*100:0;x.score=(x.sp*WEIGHTS.price+x.st*WEIGHTS.tech+x.sl*WEIGHTS.lead)/100});
 const best=Math.max(...rows.map(x=>x.score));rows.forEach(x=>{x.rec=x.score===best;x.low=x.total===minT});
 return rows;
}

  <div class="tbl-wrap"><table><thead><tr><th>Vendor</th><th class="r">Total (excl. PPN)</th><th>Termin</th><th class="r">Kirim</th><th>Garansi</th><th class="r">Skor harga</th><th class="r">Teknis</th><th class="r">Skor kirim</th><th class="r">Skor akhir</th></tr></thead><tbody>

  </tbody></table></div>

function subGR(r){
 if(!r.po)return `<div class="panel"><div class="note warn">Penerimaan barang/jasa dicatat setelah PO terbit.</div></div>`;
 const q=r.quotes[r.qcf.winner];const t=poTotal(r);
 let grPart;
 if(!r.gr){grPart=`<div class="panel stack"><h2>Goods Receipt / BAST</h2><p class="muted" style="font-size:12.5px">Isi jumlah yang benar-benar diterima. Selisih akan terdeteksi di 3-way match.</p>

  ${r.items.map((i,k)=>`<tr><td>${esc(i.name)}</td><td class="r">${i.qty} ${esc(i.uom)}</td><td class="r"><input class="cell s" type="number" min="0" id="gr_${k}" value="${i.qty}"></td></tr>`).join('')}</tbody></table></div>
  <label class="f">Catatan kondisi<input class="i" id="grNote" value="Diterima baik dan sesuai spesifikasi."></label>
  <div><button class="btn primary" data-act="saveGr">Simpan penerimaan</button></div></div>`}
 else grPart=`<div class="panel stack"><div class="row between"><h2>Goods Receipt / BAST</h2><button class="btn small" data-act="doc" data-d="gr">Lihat BAST</button></div><p><span class="mono">${r.gr.no}</span> · ${fd(r.gr.date)} · ${esc(r.gr.note)}</p></div>`;
 let invPart='';

   <p class="muted" style="font-size:12.5px">Coba ubah nilainya untuk melihat 3-way match menolak invoice yang tidak cocok.</p>
   <div><button class="btn primary" data-act="saveInv">Catat invoice & cek 3-way match</button></div></div>`;
  else{
   const ok=Math.abs(r.inv.amount-grv)<=1;
   invPart=`<div class="panel stack"><div class="row between"><h2>3-way match</h2><button class="btn small" data-act="doc" data-d="match">Lihat lembar verifikasi</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>Dokumen</th><th>Nomor</th><th class="r">Nilai (incl. PPN)</th></tr></thead><tbody>
    <tr><td>Purchase Order</td><td class="mono">${r.po.no}</td><td class="r">${rp(t.tot)}</td></tr>
    <tr><td>Goods Receipt</td><td class="mono">${r.gr.no}</td><td class="r">${rp(grv)}</td></tr>
    <tr><td>Invoice</td><td class="mono">${esc(r.inv.no)}</td><td class="r">${rp(r.inv.amount)}</td></tr></tbody></table></div>
    ${ok?`<div class="note">Cocok. Invoice sesuai barang/jasa yang diterima. ${r.paid?`Dibayar ${fd(r.paid.date)} sesuai termin ${esc(q.pay)}.`:`Siap dibayar sesuai termin ${esc(q.pay)}.`}</div>${!r.paid?`<div><button class="btn primary" data-act="pay">Tandai sudah dibayar</button></div>`:''}`
    :`<div class="note bad">Tidak cocok: selisih ${rp(r.inv.amount-grv)}. Invoice ditahan dan dikembalikan ke vendor untuk koreksi.</div><div><button class="btn" data-act="clearInv">Input ulang invoice</button></div>`}
   </div>`}
 }
 return `<div class="stack">${grPart}${invPart}</div>`;
}

 host.innerHTML=`<aside class="tour" role="dialog" aria-label="Tur panduan"><div class="prog">${TOUR.map((_,i)=>`<i class="${i<=T.step?'on':''}"></i>`).join('')}</div><div class="row between"><span class="k">Langkah ${T.step+1} dari ${n}</span><button class="btn small" data-act="tourMin" aria-label="Kecilkan panduan">Kecilkan</button></div><h3>${st.t}</h3><p>${st.d}</p>${extra}<div class="row"><button class="btn primary" data-act="tourAuto">Lakukan untuk saya</button><button class="btn" data-act="tourShow">Tunjukkan tombolnya</button><button class="btn small" data-act="tourExit">Keluar tur</button></div></aside>`;
 if(T.step===3){const n2=$('#qcfNote');if(n2&&!n2.value)n2.value='Skor tertinggi: kualitas dan waktu kirim terbaik dengan selisih harga kecil.'}
 const el=document.querySelector(st.sel);
 if(el){el.classList.add('tour-hl');const rc=el.getBoundingClientRect();if(rc.top<80||rc.bottom>window.innerHeight-300)el.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
}
function welcome(){
 let seen=false;try{seen=localStorage.getItem('siam-tour-seen')==='1'}catch(e){}
 if(seen)return;
 $('#modal').innerHTML=`<div class="overlay" role="dialog" aria-modal="true" aria-label="Selamat datang"><div class="welcome"><span class="eyebrow">Demo e-procurement</span><h2>Lihat bagaimana pengadaan yang rapi bekerja</h2><p class="muted">Anda akan mengikuti 1 pembelian printer: diajukan, disetujui, dibandingkan dari 3 vendor, dipesan, diterima, lalu dibayar. Cukup tekan tombol yang ditunjukkan. Sekitar 3 menit.</p><button class="btn primary big" data-act="tourStart">&#9654; Mulai tur panduan</button><button class="btn big" data-act="welcomeSkip">Saya mau jelajahi sendiri</button><p class="muted" style="font-size:12.5px">Semua data fiktif. Isian Anda hanya tersimpan di perangkat ini.</p></div></div>`;
}

render();
welcome();
})();
